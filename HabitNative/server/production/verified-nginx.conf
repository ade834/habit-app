# Keep this listener private until the deployment and public access checks pass.
limit_req_zone $binary_remote_addr zone=maybii_verified_per_ip:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=maybii_verified_connections:10m;
server {
    listen 127.0.0.1:8443 ssl;
    server_name api.ddream.top;
    ssl_certificate /etc/letsencrypt/live/api.ddream.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ddream.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;
    large_client_header_buffers 4 32k;
    access_log off;
    limit_req zone=maybii_verified_per_ip burst=10 nodelay;
    limit_req_status 429;
    limit_conn maybii_verified_connections 4;
    limit_conn_status 429;
    proxy_read_timeout 240s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_hide_header Access-Control-Allow-Origin;

    location = /api/attest/challenge { proxy_pass http://127.0.0.1:8769; }
    location = /api/attest/register { proxy_pass http://127.0.0.1:8769; }
    location = /api/review/reset-trial { proxy_pass http://127.0.0.1:8769; }
    location = /api/review { proxy_pass http://127.0.0.1:8769; }
    location / { return 404; }
}
