# Template only. Keep loopback until StoreKit, trial and production tests pass.
limit_req_zone $binary_remote_addr zone=anonymous_review_per_ip:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=anonymous_review_connections:10m;
server {
    listen 127.0.0.1:8443 ssl;
    server_name api.ddream.top;
    ssl_certificate /etc/letsencrypt/live/api.ddream.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ddream.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 32k;
    access_log off;
    # App Attest registration, assertions, and trial reset are required by the
    # same client flow as /api/review. Never expose arbitrary backend paths.
    location ~ ^/api/(review|review/reset-trial|attest/challenge|attest/register)$ {
        limit_req zone=anonymous_review_per_ip burst=10 nodelay;
        limit_req_status 429;
        limit_conn anonymous_review_connections 4;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8766;
        proxy_read_timeout 240s;
        proxy_max_temp_file_size 0;
        proxy_set_header Host $host;
        proxy_hide_header Access-Control-Allow-Origin;
    }
    location / { return 404; }
}
