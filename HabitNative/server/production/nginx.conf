# Keep loopback until filing and public access checks are complete.
limit_req_zone $binary_remote_addr zone=review_per_ip:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=review_connections:10m;
server {
    listen 127.0.0.1:8443 ssl;
    server_name api.ddream.top;
    ssl_certificate /etc/letsencrypt/live/api.ddream.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ddream.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 800k;
    access_log off;
    location = /api/review {
        limit_req zone=review_per_ip burst=2 nodelay;
        limit_req_status 429;
        limit_conn review_connections 2;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8766;
        proxy_read_timeout 135s;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Access-Control-Allow-Origin;
    }
    location ^~ /auth/apple/ {
        limit_req zone=review_per_ip burst=2 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8766;
        proxy_hide_header Access-Control-Allow-Origin;
    }
    location / { return 404; }
}
